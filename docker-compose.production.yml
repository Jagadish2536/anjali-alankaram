version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: anjali_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: AnjaliAlankaram2026Secure
      POSTGRES_DB: anjali_alankaram
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: anjali_redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: anjali_backend
    restart: always
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-AnjaliAlankaram2026Secure}@postgres:5432/${POSTGRES_DB:-anjali_alankaram}?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://anjalialankaram.com/api/v1
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: 98366727786-33s4ejrb2d1g5od9uap7mjhg361bh1tq.apps.googleusercontent.com
        NEXT_PUBLIC_RAZORPAY_KEY_ID: rzp_live_TCEPo731G2pscv
    container_name: anjali_frontend
    restart: always
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://${DOMAIN_NAME:-anjalialankaram.com}/api/v1
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=98366727786-33s4ejrb2d1g5od9uap7mjhg361bh1tq.apps.googleusercontent.com
      - NEXT_PUBLIC_RAZORPAY_KEY_ID=rzp_live_TCEPo731G2pscv
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      - backend

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
