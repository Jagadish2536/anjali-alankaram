name: Cleanup Old Snapshots

on:
  schedule:
    - cron: '30 18 * * *'   # 18:30 UTC = 12:00 AM IST daily
  workflow_dispatch:

env:
  AWS_REGION: ap-south-2

jobs:
  cleanup:
    name: Delete old RDS pre-deploy snapshots
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Delete pre-deploy RDS snapshots older than 24 hours
      run: |
        echo "🧹 Daily cleanup — $(date -u '+%Y-%m-%d %H:%M UTC')"
        echo "Note: EBS automated snapshots on EC2 are automatically rotated by AWS DLM Policy."
        echo "Scanning for legacy pre-deploy-* RDS snapshots older than 24 hours..."

        CUTOFF=$(date -u -d '24 hours ago' +%s)

        SNAPSHOTS=$(aws rds describe-db-snapshots \
          --region ${{ env.AWS_REGION }} \
          --snapshot-type manual \
          --query "DBSnapshots[?starts_with(DBSnapshotIdentifier, 'pre-deploy-')].{id:DBSnapshotIdentifier,time:SnapshotCreateTime,status:Status}" \
          --output json 2>/dev/null || echo "[]")

        TOTAL=$(echo "$SNAPSHOTS" | jq length 2>/dev/null || echo 0)
        echo "Found $TOTAL pre-deploy snapshot(s) total"

        if [ "$TOTAL" -eq 0 ]; then
          echo "✅ No legacy pre-deploy snapshots found. Cleanup complete."
          exit 0
        fi

        echo "$SNAPSHOTS" | jq -r '.[] | "\(.time) \(.id) \(.status)"' | while read SNAP_TIME SNAP_ID SNAP_STATUS; do
          SNAP_EPOCH=$(date -u -d "$SNAP_TIME" +%s 2>/dev/null || echo 0)

          if [ "$SNAP_EPOCH" -eq 0 ]; then
            continue
          fi

          if [ "$SNAP_EPOCH" -lt "$CUTOFF" ]; then
            echo "🗑️ Deleting legacy RDS snapshot: $SNAP_ID"
            aws rds delete-db-snapshot --db-snapshot-identifier "$SNAP_ID" --region ${{ env.AWS_REGION }} || true
          fi
        done

        echo "🧹 Daily cleanup complete."

