name: Deploy to Simple EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Application to Simple EC2 Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Execute Remote SSH Commands for Auto-Deployment
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "Starting deployment on EC2..."
            
            # Ensure /app directory exists and has permissions
            sudo mkdir -p /app
            sudo chown -R ubuntu:ubuntu /app
            cd /app
            
            # Clone if first time, pull if repo exists, or wipe & clone if dir is dirty
            if [ -d ".git" ]; then
              echo "Repo already exists — pulling latest changes from main branch..."
              git fetch origin main
              git reset --hard origin/main
            else
              echo "No .git found — clearing any stale files and cloning fresh..."
              # Remove all files including hidden ones, but keep the /app dir itself
              find /app -mindepth 1 -delete
              git clone https://github.com/Jagadish2536/anjali-alankaram.git .
            fi
            
            # Rebuild and start production Docker containers
            docker compose -f docker-compose.production.yml up -d --build --remove-orphans
            
            # Run database migrations
            docker exec anjali_backend npx prisma migrate deploy || true
            
            # Prune unused docker images to save disk space
            docker image prune -f
            
            echo "Deployment successfully completed!"

