name: Deploy to Simple EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Application to Simple EC2 Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Write backend .env to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: BACKEND_ENV
          script: |
            sudo mkdir -p /app/backend
            sudo chown -R ubuntu:ubuntu /app/backend
            printf '%s' "$BACKEND_ENV" > /app/backend/.env
            echo "backend/.env written ($(wc -l < /app/backend/.env) lines)"
        env:
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}

      - name: Execute Remote SSH Commands for Auto-Deployment
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e

            echo "=== [1/6] Starting deployment on EC2 ==="
            echo "User: $(whoami) | Dir: $(pwd)"

            # Ensure /app directory exists and has permissions
            echo "=== [2/6] Setting up /app directory ==="
            sudo mkdir -p /app
            sudo chown -R ubuntu:ubuntu /app
            cd /app
            echo "Now in: $(pwd)"

            # Clone or pull
            echo "=== [3/6] Syncing repository ==="
            if [ -d ".git" ]; then
              echo "Repo exists — pulling latest from main..."
              git fetch origin main
              git reset --hard origin/main
              git clean -fd
              # Restore .env that git clean may have wiped
              echo "Restoring .env protection (git clean excludes .env)..."
            else
              echo "No .git found — wiping /app and cloning fresh..."
              # Save .env before wipe, restore after clone
              if [ -f /app/backend/.env ]; then
                cp /app/backend/.env /tmp/backend.env.bak
              fi
              sudo rm -rf /app/* /app/.[!.]* 2>/dev/null || true
              git clone https://github.com/Jagadish2536/anjali-alankaram.git .
              # Restore .env
              if [ -f /tmp/backend.env.bak ]; then
                mkdir -p /app/backend
                cp /tmp/backend.env.bak /app/backend/.env
                rm -f /tmp/backend.env.bak
              fi
            fi
            echo "Git status: $(git log --oneline -1)"

            # Verify .env exists
            echo "=== [3b] Verifying .env ==="
            ls -la /app/backend/.env && echo ".env OK" || echo "WARNING: .env missing!"

            # Check docker compose availability
            echo "=== [4/6] Checking docker compose ==="
            if docker compose version > /dev/null 2>&1; then
              COMPOSE_CMD="docker compose"
              echo "Using: docker compose (v2)"
            else
              COMPOSE_CMD="docker-compose"
              echo "Using: docker-compose (v1)"
            fi

            # Rebuild and start production Docker containers
            echo "=== [5/6] Building & starting containers ==="
            $COMPOSE_CMD -f docker-compose.production.yml up -d --build --remove-orphans

            # Run database migrations
            echo "=== [6/6] Running migrations & cleanup ==="
            docker exec anjali_backend npx prisma migrate deploy || echo "Migration skipped (container may not be ready yet)"

            # Prune unused docker images to save disk space
            docker image prune -f

            echo "=== Deployment successfully completed! ==="

